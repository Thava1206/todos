<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos</title>
  </head>
  <body>
    <main>
        <div class="mainPage">
            
            <div class="cmain">
              <h1>Default</h1>
              <button class="open-form">Add Task</button>
              <ul id="todo-list"></ul>
              <div class="form-popup" id="myForm">
                <form class="form-container">
                <h1>Task</h1>

                <label for="task">Task</label>
                <input type="text" placeholder="Enter Task" name="task" id="theTask" required>

                <label for="priority">Priority</label>
                <input type="number" placeholder="1-5" name="priority" id="priorityLevel" required>

                <button type="submit" class="btn submit">Submit</button>
                <button type="button" class="btn cancel">Close</button>
                </form>

                
              </div>
              
            </div>
            
        </div>
        
    </main>
  </body>
</html>
